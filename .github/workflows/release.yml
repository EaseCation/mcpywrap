name: Test, build and publish

on:
  push:
    branches: [main, 'codex/0.4.0-*', 'codex/shared-python-core']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main version to PyPI after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select signing mode
        id: mode
        shell: pwsh
        run: |
          $signed = '${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}'
          "signed=$signed" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must belong to main' }
          }
      - name: Compile all native components from source
        run: python scripts/build_all_native.py
      - name: Sign using protected repository secrets
        if: steps.mode.outputs.signed == 'true'
        shell: pwsh
        env:
          MCS_BRIDGE_SIGNING_PFX: ${{ secrets.MCS_BRIDGE_SIGNING_PFX }}
          MCS_BRIDGE_SIGNING_PASSWORD: ${{ secrets.MCS_BRIDGE_SIGNING_PASSWORD }}
        run: ./scripts/sign_mcs_auth_ci.ps1
      - run: python scripts/check_mcs_auth_bridge.py ${{ steps.mode.outputs.signed == 'true' && '--require-signed' || '' }}
      - run: python scripts/check_window_capture.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcs-auth-bridge
          path: |
            desktop/mcpywrap_assets/bridge_payload/*.exe
            desktop/mcpywrap_assets/bridge_payload/*.dll
            desktop/mcpywrap_assets/bridge_payload/*.cer
            desktop/mcpywrap_assets/bridge_payload/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-capture
          path: |
            desktop/mcpywrap_assets/window_capture/*.exe
            desktop/mcpywrap_assets/window_capture/manifest.json
          if-no-files-found: error
      - run: python scripts/check_window_activation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-activation
          path: |
            desktop/mcpywrap_assets/window_activation/*.dll
            desktop/mcpywrap_assets/window_activation/manifest.json
          if-no-files-found: error

  test:
    needs: native
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcs-auth-bridge
          path: desktop/mcpywrap_assets/bridge_payload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-capture
          path: desktop/mcpywrap_assets/window_capture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-activation
          path: desktop/mcpywrap_assets/window_activation
      - run: python -m pip install ./core .
      - run: python scripts/check_window_activation.py
      - run: python -m unittest discover -s tests -p 'test_core*.py' -v
      - run: python -m unittest discover -s tests -p test_host_services.py -v
      - run: python -m unittest discover -s tests -p test_distribution_layout.py -v
      - run: python -m unittest discover -s tests -p test_lock_storage.py -v
      - run: python -m pip check
      - name: Verify installed native components
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -c "from importlib.metadata import distribution; from pathlib import Path; import hashlib,json; root=Path(distribution('mcpywrap').locate_file('mcpywrap_assets')); capture=root/'window_capture'; manifest=json.loads((capture/'manifest.json').read_text(encoding='utf-8')); assert hashlib.sha256((capture/'mcpy-window-capture.exe').read_bytes()).hexdigest()==manifest['executable_sha256']; bridge=root/'bridge_payload'; assert all((bridge/name).is_file() for name in ('Injector.exe','Loader.dll','McpyMcsAuth.dll','manifest.json'))"
          Pop-Location
      - run: python scripts/check_mcs_auth_bridge.py
      - run: python scripts/check_window_capture.py
      - name: Verify bridge signatures without changing certificate trust
        if: needs.native.outputs.signed == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content desktop/mcpywrap_assets/bridge_payload/manifest.json -Raw | ConvertFrom-Json
          foreach ($name in @('Injector.exe','Loader.dll','McpyMcsAuth.dll')) {
            $signature = Get-AuthenticodeSignature -LiteralPath "desktop/mcpywrap_assets/bridge_payload/$name"
            if ($signature.SignerCertificate.Thumbprint -ne $manifest.thumbprint -or $signature.Status -in @('HashMismatch','NotSigned','NotSupportedFileFormat')) { throw "Invalid bridge signature: $name" }
          }
      - run: python -m unittest discover -s tests -v
      - name: Verify deployment recovery with Windows default GBK
        run: python -m unittest discover -s tests -p 'test_deployment_*.py' -v
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: gbk
      - run: python -m compileall -q core desktop tests

  macos:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./core .
      - run: python -m unittest discover -s tests -p 'test_core*.py' -v
      - run: python -m unittest discover -s tests -p test_host_services.py -v
      - run: python -m unittest discover -s tests -p test_distribution_layout.py -v
      - run: python -m unittest discover -s tests -p test_lock_storage.py -v
      - run: python -m pip check
      - name: Verify Qt6 availability and lazy CLI imports
        run: python -c "import sys; import mcpywrap_core.cli; assert not any(k.startswith('PySide6') for k in sys.modules); import PySide6.QtCore"
      - run: python -m unittest discover -s tests -p test_modsdk_environment.py -v
      - run: python -m unittest discover -s tests -p test_remote.py -v
      - run: python -m unittest discover -s tests -p test_remote_scripts.py -v
      - run: python -m unittest discover -s tests -p test_git_projects.py -v
      - run: python -m unittest discover -s tests -p test_unbundled_dependencies.py -v
      - run: python -m unittest discover -s tests -p test_qumod_workflow.py -v
      - run: python -m unittest discover -s tests -p test_recordings.py -v
      - run: python -m unittest discover -s tests -p 'test_runtime*.py' -v
      - run: python -m unittest discover -s tests -p test_host_input.py -v
      - run: python -m unittest discover -s tests -p test_resource_reload.py -v
      - run: python -m unittest discover -s tests -p test_session_capabilities.py -v
      - run: python -m unittest discover -s tests -p test_skill_workflows.py -v
      - run: python -m unittest discover -s tests -p 'test_mobile*.py' -v
      - run: python -m unittest discover -s tests -p test_execution_boundaries.py -v
      - run: python -m unittest discover -s tests -p test_restricted_process_identity.py -v
      - run: python -m unittest discover -s tests -p test_log_query.py -v
      - run: python -m unittest discover -s tests -p test_input_sequence.py -v
      - run: python -m unittest discover -s tests -p test_shared_logs.py -v
      - run: python -m unittest discover -s tests -p test_log_stream.py -v
      - run: python -m unittest discover -s tests -p test_qt_sessions.py -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m unittest discover -s tests -p test_project_scripts.py -v
      - run: python -m unittest discover -s tests -p test_consumer_prepare.py -v
      - run: python -m unittest discover -s tests -p test_macos_network.py -v
      - run: python -m unittest discover -s tests -p test_engine_backends.py -v
      - run: python -m unittest discover -s tests -p test_engine_install.py -v
      - run: python -m unittest discover -s tests -p test_application_icons.py -v
      - run: python -m unittest discover -s tests -p test_launcher_python.py -v
      - run: python -m unittest discover -s tests -p test_screenshot.py -v
      - run: python -m unittest discover -s tests -p test_game_window_skill.py -v
      - run: python -m unittest discover -s tests -p test_window_policy.py -v
      - run: python -m unittest discover -s tests -p test_window_activation.py -v
      - name: Build a project using the public CLI
        run: |
          mkdir -p "$RUNNER_TEMP/中文 project"
          mcpy --local --project "$RUNNER_TEMP/中文 project" --non-interactive init --name mac-smoke --type addon --json
          mcpy --local --project "$RUNNER_TEMP/中文 project" --non-interactive package --json

  linux:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./core .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_mobile*.py' -v
      - run: python -m unittest discover -s tests -p test_execution_boundaries.py -v
      - run: python -m unittest discover -s tests -p test_restricted_process_identity.py -v
      - run: python -m unittest discover -s tests -p 'test_core*.py' -v
      - run: python -m unittest discover -s tests -p test_project_scripts.py -v
      - run: python -m unittest discover -s tests -p test_log_query.py -v
      - run: python -m unittest discover -s tests -p test_skill_workflows.py -v

  build:
    needs: [test, native, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcs-auth-bridge
          path: desktop/mcpywrap_assets/bridge_payload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-capture
          path: desktop/mcpywrap_assets/window_capture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-activation
          path: desktop/mcpywrap_assets/window_activation
      - run: python -m pip install build twine
      - run: python scripts/check_window_activation.py
      - name: Check release version and main ancestry
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/version.py --check-tag "$GITHUB_REF_NAME"
          else
            python scripts/version.py
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: python scripts/build_distributions.py
      - run: python -m twine check --strict dist/core/* dist/desktop/*
      - run: python scripts/check_release.py --require-native
      - name: Verify core-only installation and in-place upgrade from the published release
        shell: bash
        run: |
          python -m pip download --no-deps --index-url https://pypi.org/simple mcpywrap==0.5.8 --dest "$RUNNER_TEMP/legacy"
          python scripts/verify_distributions.py --legacy-wheel "$RUNNER_TEMP/legacy/mcpywrap-0.5.8-py3-none-any.whl"
      - run: python scripts/check_window_capture.py
      - run: python scripts/check_mcs_auth_bridge.py ${{ needs.native.outputs.signed == 'true' && '--require-signed' || '' }}
      - name: Smoke test the built wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/core/*.whl dist/desktop/*.whl
          cd "$RUNNER_TEMP"
          wheel-smoke/bin/python -c "import importlib.util; from importlib.metadata import version; from mcpywrap_core import __version__; assert __version__ == version('mcpywrap'); assert importlib.util.find_spec('mcpywrap') is None; from mcpywrap_core.dependencies import DependencyService; from mcpywrap_core.consumer_prepare import PreparationPlan; from jsonschema import Draft202012Validator; from mcpywrap_core.minecraft.template.generate_mod_files import generate_mod_framework"
          wheel-smoke/bin/mcpy --help
          wheel-smoke/bin/mcpy add --help
          wheel-smoke/bin/mcpy deps --help
          wheel-smoke/bin/mcpy connect --help
          wheel-smoke/bin/mcpy deployment --help
          wheel-smoke/bin/mcpy deployment migrate --help
          wheel-smoke/bin/mcpy runtime ui --help
          wheel-smoke/bin/mcpy runtime player --help
          wheel-smoke/bin/mcpy runtime input --help
          wheel-smoke/bin/mcpy runtime input run --help
          wheel-smoke/bin/mcpy input-sequence --help
          wheel-smoke/bin/python -m pip check
          mkdir wheel-cli-project
          cd wheel-cli-project
          printf '[project]\nname="release-smoke"\nversion="0.0.0"\ndependencies=[]\n' > pyproject.toml
          PIP_NO_INDEX=1 ../wheel-smoke/bin/mcpy add 'click>=8'
          ../wheel-smoke/bin/python -c "import tomllib; from pathlib import Path; assert 'click>=8' in tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, native]
    if: >-
      needs.native.outputs.signed == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpywrap/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare missing core files (verify existing hashes)
        id: core-upload
        run: python scripts/pypi_release.py prepare --project mcpywrap-core --directory dist/core --outdir upload-core
      - name: Publish core first
        if: steps.core-upload.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload-core/
      - name: Confirm core artifacts are visible
        run: python scripts/pypi_release.py wait --project mcpywrap-core --directory dist/core
      - name: Prepare missing desktop files (verify existing hashes)
        id: desktop-upload
        run: python scripts/pypi_release.py prepare --project mcpywrap --directory dist/desktop --outdir upload-desktop
      - name: Publish complete distribution
        if: steps.desktop-upload.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload-desktop/
