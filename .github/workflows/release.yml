name: Test, build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main version to PyPI after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select signing mode
        id: mode
        shell: pwsh
        run: |
          $signed = '${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}'
          "signed=$signed" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must belong to main' }
          }
      - name: Compile all native components from source
        run: python scripts/build_all_native.py
      - name: Sign using protected repository secrets
        if: steps.mode.outputs.signed == 'true'
        shell: pwsh
        env:
          MCS_BRIDGE_SIGNING_PFX: ${{ secrets.MCS_BRIDGE_SIGNING_PFX }}
          MCS_BRIDGE_SIGNING_PASSWORD: ${{ secrets.MCS_BRIDGE_SIGNING_PASSWORD }}
        run: ./scripts/sign_mcs_auth_ci.ps1
      - run: python scripts/check_mcs_auth_bridge.py ${{ steps.mode.outputs.signed == 'true' && '--require-signed' || '' }}
      - run: python scripts/check_window_capture.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcs-auth-bridge
          path: |
            mcpywrap/mcstudio/bridge_payload/*.exe
            mcpywrap/mcstudio/bridge_payload/*.dll
            mcpywrap/mcstudio/bridge_payload/*.cer
            mcpywrap/mcstudio/bridge_payload/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-capture
          path: |
            mcpywrap/mcstudio/window_capture/*.exe
            mcpywrap/mcstudio/window_capture/manifest.json
          if-no-files-found: error

  test:
    needs: native
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcs-auth-bridge
          path: mcpywrap/mcstudio/bridge_payload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-capture
          path: mcpywrap/mcstudio/window_capture
      - run: python -m pip install .
      - run: python -m pip check
      - name: Verify installed native components
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -c "from importlib.metadata import distribution; from pathlib import Path; import hashlib,json; root=Path(distribution('mcpywrap').locate_file('mcpywrap/mcstudio')); capture=root/'window_capture'; manifest=json.loads((capture/'manifest.json').read_text(encoding='utf-8')); assert hashlib.sha256((capture/'mcpy-window-capture.exe').read_bytes()).hexdigest()==manifest['executable_sha256']; bridge=root/'bridge_payload'; assert all((bridge/name).is_file() for name in ('Injector.exe','Loader.dll','McpyMcsAuth.dll','manifest.json'))"
          Pop-Location
      - run: python scripts/check_mcs_auth_bridge.py
      - run: python scripts/check_window_capture.py
      - name: Verify bridge signatures without changing certificate trust
        if: needs.native.outputs.signed == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content mcpywrap/mcstudio/bridge_payload/manifest.json -Raw | ConvertFrom-Json
          foreach ($name in @('Injector.exe','Loader.dll','McpyMcsAuth.dll')) {
            $signature = Get-AuthenticodeSignature -LiteralPath "mcpywrap/mcstudio/bridge_payload/$name"
            if ($signature.SignerCertificate.Thumbprint -ne $manifest.thumbprint -or $signature.Status -in @('HashMismatch','NotSigned','NotSupportedFileFormat')) { throw "Invalid bridge signature: $name" }
          }
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q mcpywrap tests

  macos:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m pip check
      - name: Verify client install without Qt
        run: python -c "import importlib.util; assert importlib.util.find_spec('PyQt5') is None; import mcpywrap.cli"
      - run: python -m unittest discover -s tests -p test_remote.py -v
      - run: python -m unittest discover -s tests -p test_remote_scripts.py -v
      - run: python -m unittest discover -s tests -p test_git_projects.py -v
      - run: python -m unittest discover -s tests -p test_qumod_workflow.py -v
      - run: python -m unittest discover -s tests -p test_recordings.py -v
      - run: python -m unittest discover -s tests -p 'test_runtime*.py' -v
      - run: python -m unittest discover -s tests -p test_input_sequence.py -v
      - name: Build a project using the public CLI
        run: |
          mkdir -p "$RUNNER_TEMP/中文 project"
          mcpy --local --project "$RUNNER_TEMP/中文 project" --non-interactive init --name mac-smoke --type addon --json
          mcpy --local --project "$RUNNER_TEMP/中文 project" --non-interactive package --json

  build:
    needs: [test, native, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcs-auth-bridge
          path: mcpywrap/mcstudio/bridge_payload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: window-capture
          path: mcpywrap/mcstudio/window_capture
      - run: python -m pip install build twine
      - name: Check release version and main ancestry
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          source = pathlib.Path('mcpywrap/__init__.py').read_text()
          assert re.search(r"__version__ = ['\"]" + re.escape(version) + r"['\"]", source)
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          PY
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py
      - run: python scripts/check_window_capture.py
      - run: python scripts/check_mcs_auth_bridge.py ${{ needs.native.outputs.signed == 'true' && '--require-signed' || '' }}
      - name: Smoke test the built wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-smoke/bin/python -c "from importlib.metadata import version; from mcpywrap import __version__; assert __version__ == version('mcpywrap'); from mcpywrap.dependencies import DependencyService; from mcpywrap.minecraft.template.generate_mod_files import generate_mod_framework"
          wheel-smoke/bin/mcpy --help
          wheel-smoke/bin/mcpy add --help
          wheel-smoke/bin/mcpy connect --help
          wheel-smoke/bin/mcpy runtime ui --help
          wheel-smoke/bin/mcpy runtime player --help
          wheel-smoke/bin/mcpy input-sequence --help
          wheel-smoke/bin/python -m pip check
          mkdir wheel-cli-project
          cd wheel-cli-project
          printf '[project]\nname="release-smoke"\nversion="0.0.0"\ndependencies=[]\n' > pyproject.toml
          PIP_NO_INDEX=1 ../wheel-smoke/bin/mcpy add 'click>=8'
          ../wheel-smoke/bin/python -c "import tomllib; from pathlib import Path; assert 'click>=8' in tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, native]
    if: >-
      needs.native.outputs.signed == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpywrap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
