name: Test, build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main version to PyPI after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q mcpywrap tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check release version and main ancestry
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          source = pathlib.Path('mcpywrap/__init__.py').read_text()
          assert re.search(r"__version__ = ['\"]" + re.escape(version) + r"['\"]", source)
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          PY
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py
      - name: Smoke test the built wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-smoke/bin/python -c "from importlib.metadata import version; from mcpywrap import __version__; assert __version__ == version('mcpywrap'); from mcpywrap.dependencies import DependencyService; from mcpywrap.minecraft.template.generate_mod_files import generate_mod_framework"
          wheel-smoke/bin/mcpy --help
          wheel-smoke/bin/mcpy add --help
          wheel-smoke/bin/python -m pip check
          mkdir wheel-cli-project
          cd wheel-cli-project
          printf '[project]\nname="release-smoke"\nversion="0.0.0"\ndependencies=[]\n' > pyproject.toml
          PIP_NO_INDEX=1 ../wheel-smoke/bin/mcpy add 'click>=8'
          ../wheel-smoke/bin/python -c "import tomllib; from pathlib import Path; assert 'click>=8' in tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpywrap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
