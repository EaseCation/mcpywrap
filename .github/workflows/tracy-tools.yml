name: Tracy tools

# 从固定的 Tracy 0.11.1 源码构建 mcpy 分析工具包（profiler / capture / csvexport / mcpy-tracy-report）。
# 推送 tracy-tools-<版本>-<构建号> 标签时发布 GitHub Release；手动运行只上传构建产物。
on:
  push:
    tags: ['tracy-tools-*']
  workflow_dispatch:
    inputs:
      build:
        description: Package build number for Tracy 0.11.1
        default: '1'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve build number
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tracy-tools-* ]]; then
            tag="${GITHUB_REF#refs/tags/tracy-tools-}"
            [[ "$tag" == 0.11.1-* ]] || { echo "标签必须是 tracy-tools-0.11.1-<构建号>"; exit 1; }
            echo "build=${tag#0.11.1-}" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ inputs.build || '1' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: python native/tracy_tools/build.py --work build-tracy --output dist-tracy --build ${{ steps.meta.outputs.build }}
      - name: Smoke test
        shell: python
        run: |
          import glob, hashlib, json, os, subprocess, zipfile
          zipfile.ZipFile(glob.glob('dist-tracy/*.zip')[0]).extractall('smoke-tracy')
          root = os.path.join('smoke-tracy', 'mcpy-tracy')
          info = json.load(open(os.path.join(root, 'BUILDINFO.json')))
          for name, digest in info['files'].items():
              assert hashlib.sha256(open(os.path.join(root, name), 'rb').read()).hexdigest() == digest, name
          suffix = '.exe' if os.name == 'nt' else ''
          for name in ('mcpy-tracy-report', 'tracy-csvexport'):
              path = os.path.join(root, name + suffix)
              os.chmod(path, 0o755)
              subprocess.run([path, '--help'], check=True)
          if os.name == 'nt':
              # 只允许系统 DLL：静态链接后不应再引用 VC++ 运行库或第三方库的 DLL
              for name in info['files']:
                  data = open(os.path.join(root, name), 'rb').read().lower()
                  for dll in (b'msvcp140.dll', b'msvcp140_atomic_wait.dll', b'vcruntime140.dll',
                              b'vcruntime140_1.dll', b'glfw3.dll', b'freetype.dll', b'capstone.dll'):
                      assert dll not in data, (name, dll)
          print(json.dumps(info, indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracy-tools-${{ matrix.os }}
          path: dist-tracy/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/tracy-tools-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Platform entries for tools.json
        run: |
          python3 - <<'EOF'
          import glob, json
          entries = {}
          for path in sorted(glob.glob('dist/*.json')):
              item = json.load(open(path))
              entries[item.pop('platform')] = item
          json.dump(entries, open('dist/platforms.json', 'w'), indent=2)
          print(json.dumps(entries, indent=2))
          EOF
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Tracy 0.11.1 (protocol 69) tools for mcpywrap `mcpy profile`, built from
          wolfpld/tracy v0.11.1 (5d542dc09f3d9378d005092a4ad446bd405f819a) by
          `native/tracy_tools/build.py`. Each archive contains tracy-profiler,
          tracy-capture, tracy-csvexport and mcpy-tracy-report. Tracy is BSD-3-Clause;
          the license is included in each archive.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/platforms.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Tracy tools ${GITHUB_REF_NAME#tracy-tools-}" \
            --notes-file notes.md --latest=false
