[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpywrap"
version = "0.3.19"
description = "A wrapper for Minecraft China Edition Addons management"
readme = "README.md"
authors = [{name = "boybook", email = "boybook@easecation.net"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pip>=21",
    "build>=1.0",
    "click>=8.0.0",
    "watchdog>=2.0.0",
    "twine>=3.4.0",
    "tomli",
    "tomli-w",
    "setuptools",
    "packaging>=21",
    "PyQt5>=5.15.0; sys_platform == 'win32'",
    "psutil>=5.8.0",
    "rich>=10.0.0"
]

[project.scripts]
mcpywrap = "mcpywrap.__main__:main"
mcpy = "mcpywrap.__main__:main"

[project.urls]
"Homepage" = "https://github.com/EaseCation/mcpywrap"
"Bug Tracker" = "https://github.com/EaseCation/mcpywrap/issues"

[tool.setuptools.packages.find]
include = ["mcpywrap*"]

[tool.setuptools.package-data]
"mcpywrap.mcstudio" = ["bridge_payload/*.exe", "bridge_payload/*.dll", "bridge_payload/*.cer", "bridge_payload/manifest.json", "window_capture/*.exe", "window_capture/manifest.json"]
