[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpywrap"
dynamic = ["version", "dependencies"]
description = "Complete mcpy desktop tools, powered by the shared mcpywrap-core"
readme = "README.md"
authors = [{name = "boybook", email = "boybook@easecation.net"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"

[project.scripts]
mcpy = "mcpywrap_core.__main__:main"
mcpywrap = "mcpywrap_core.__main__:main"

[project.urls]
Homepage = "https://github.com/EaseCation/mcpywrap"
"Bug Tracker" = "https://github.com/EaseCation/mcpywrap/issues"

[tool.setuptools]
package-dir = {"" = "desktop"}

[tool.setuptools.packages.find]
where = ["desktop"]
include = ["mcpywrap", "mcpywrap_assets"]
namespaces = false

[tool.setuptools.package-data]
mcpywrap_assets = ["bridge_payload/*.exe", "bridge_payload/*.dll", "bridge_payload/*.cer", "bridge_payload/*.json", "window_capture/*.exe", "window_capture/*.json"]
